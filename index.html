<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onaghosham 2026 | JBMA</title>
    <meta
      name="description"
      content="Onaghosham 2026 links from Johor Bahru Malayalee Association — voting, website, feedback, and socials."
    />
    <meta property="og:title" content="Onaghosham 2026" />
    <meta
      property="og:description"
      content="Mrs &amp; Ms Malayalee Johor voting, JBMA website, feedback form, and official socials."
    />
    <meta property="og:image" content="assets/logo.png" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <div class="page">
      <main class="card">
        <header class="hero">
          <img
            class="logo"
            src="assets/logo.png"
            alt="Onaghosham 2026 — Johor Bahru Malayalee Association"
          />
        </header>

        <nav id="links" class="links" aria-label="Onaghosham 2026 links"></nav>

        <section class="qr-block" aria-labelledby="qr-heading">
          <h2 id="qr-heading">Scan to share</h2>
          <p class="qr-copy">Point a camera at this code to open these links.</p>
          <div id="qr" class="qr" role="img" aria-label="QR code for this page"></div>
          <button type="button" id="download-qr" class="download-btn">
            Download QR
          </button>
        </section>

        <footer class="footer">@official.jbma</footer>
      </main>
    </div>

    <div id="donate-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close-donate></div>
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="donate-title"
      >
        <h2 id="donate-title">Donate via DuitNow QR</h2>
        <p class="modal-copy">Scan with your bank or e-wallet app.</p>
        <p class="modal-copy">
          Your generous donation helps fund our youth sports and activities for
          the betterment of the upcoming younger generation.
        </p>
        <img
          class="donate-qr"
          src="assets/duitnow-qr.png"
          alt="DuitNow QR for Persatuan Malayalee"
        />
        <button type="button" class="download-btn modal-close" data-close-donate>
          Close
        </button>
      </div>
    </div>

    <script src="vendor/qrcode.min.js"></script>
    <script src="app.js?v=4"></script>
  </body>
</html>
